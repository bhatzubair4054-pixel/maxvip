<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Users · MAX VIP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' stroke='%23ff4d6a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body data-page="users">

  <div class="bg-fx" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="blob b3"></div><div class="blob b4"></div>
    <div class="vignette"></div>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <aside class="sidebar glass" id="sidebar">
    <div class="brand">
      <div class="brand-badge sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 20 7v10l-8 5-8-5V7l8-5Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 15V9l3.5 4 3.5-4v6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-name sm">MAX <span class="rgb-text">VIP</span></div>
        <div class="brand-sub">License Panel</div>
      </div>
    </div>

    <nav class="nav">
      <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
      <a href="keys.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="16" r="3.5"/><path d="M10.5 13.5 20 4m-4.5.5L19 8"/></svg>License Keys</a>
      <a href="users.html" class="nav-link active" data-owner-only hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15.2c2.6.4 4.6 2 5.4 4.8"/></svg>Users</a>
      <a href="settings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#000"/><circle cx="15" cy="12" r="2" fill="#000"/><circle cx="7" cy="17" r="2" fill="#000"/></svg>Settings</a>
    </nav>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="sideAvatar">M</div>
        <div class="user-meta">
          <div class="user-name" id="sideName">—</div>
          <div class="user-role" id="sideRole">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="m15 17 5-5-5-5M20 12H9"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar glass">
      <div>
        <h1 class="page-title">Users</h1>
        <p class="page-sub">Manage panel accounts and review activity</p>
      </div>
      <div class="chip" id="topDate"></div>
    </header>

    <section class="content">
      <section class="glass panel">
        <div class="panel-head">
          <h2>Registered Users</h2>
          <span class="muted" id="userCount"></span>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>User</th><th>Role</th><th>Referred By</th><th>Created</th><th>Last Login</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </section>

      <section class="glass panel">
        <div class="panel-head">
          <h2>Activity Logs</h2>
          <button class="btn btn-ghost btn-sm" id="logsRefresh">Refresh</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th><th>IP</th></tr></thead>
            <tbody id="logsBody"></tbody>
          </table>
        </div>
      </section>
    </section>

    <footer class="footer"><b>MAX VIP</b> · MADE BY MAX · TG: <a href="https://t.me/kryvexo" target="_blank" rel="noopener">@kryvexo</a></footer>
  </main>

  <!-- Edit user modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Edit User</h3>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editUserId">
        <div class="field">
          <label>Username</label>
          <input class="input" id="euName">
        </div>
        <div class="field">
          <label>New password</label>
          <input type="password" class="input" id="euPass" placeholder="Leave blank to keep current">
        </div>
        <div class="field">
          <label>Role</label>
          <select class="input select" id="euRole">
            <option value="user">User</option>
            <option value="owner">Owner</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" data-close>Cancel</button>
          <button class="btn btn-primary" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p class="muted" id="confirmText"></p>
      <div class="field" id="confirmReasonWrap" hidden>
        <label>Reason (optional)</label>
        <input class="input" id="confirmReason" placeholder="Reason...">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="confirmOk" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast-root" id="toastRoot"></div>
</body>
</html>
